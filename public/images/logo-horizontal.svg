    <line x1="42" y1="158" x2="158" y2="42" stroke="#F9A825" stroke-width="3" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="5" fill="white"/>
    <!-- Decorative diamonds -->
    <rect x="168" y="22" width="12" height="12" rx="2" fill="#F9A825" transform="rotate(15 174 28)"/>
    <rect x="178" y="36" width="10" height="10" rx="2" fill="#1B3A6B" transform="rotate(15 183 41)"/>
    <rect x="164" y="38" width="7" height="7" rx="1" fill="#7CB342" transform="rotate(15 167.5 41.5)"/>
    <rect x="14" y="155" width="8" height="8" rx="1" fill="#7CB342" transform="rotate(15 18 159)"/>
    <rect x="6" y="145" width="6" height="6" rx="1" fill="#1B3A6B" transform="rotate(15 9 148)"/>
  </g>

  <!-- Text: "Tech" in navy -->
  <text x="130" y="78" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="52" fill="#1B2A4A">Tech</text>
  <!-- Text: "Compass" in green -->
  <text x="258" y="78" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="52" fill="#7CB342">Compass</text>
