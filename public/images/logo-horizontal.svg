    <circle cx="100" cy="100" r="90" fill="#D0D0D0" opacity="0.2"/>
    <!-- Globe base -->
    <circle cx="100" cy="100" r="82" fill="#1B3A6B"/>
    <!-- Continents -->
    <path d="M55 55 C60 45, 75 40, 80 45 C85 50, 82 60, 78 65 C74 70, 65 72, 58 68 C52 64, 50 58, 55 55Z" fill="#7CB342"/>
    <path d="M62 105 C65 98, 72 95, 76 100 C80 105, 78 115, 75 122 C72 128, 66 130, 63 125 C60 120, 59 112, 62 105Z" fill="#7CB342"/>
    <path d="M100 42 C105 38, 115 40, 118 45 C121 50, 118 55, 114 58 C110 61, 104 60, 100 56 C97 52, 96 46, 100 42Z" fill="#7CB342"/>
    <path d="M108 68 C112 62, 122 60, 128 65 C134 70, 135 82, 132 92 C129 102, 120 108, 115 105 C110 102, 105 90, 106 80 C107 74, 105 72, 108 68Z" fill="#7CB342"/>
    <path d="M120 42 C128 38, 140 42, 145 50 C150 58, 148 65, 142 68 C136 71, 128 68, 124 62 C120 56, 116 48, 120 42Z" fill="#7CB342"/>
    <path d="M135 110 C140 106, 148 108, 150 114 C152 120, 148 126, 142 127 C136 128, 132 124, 132 118 C132 114, 132 112, 135 110Z" fill="#7CB342"/>
